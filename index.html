<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ワンルームタワー</title>
</head>
<body>
<div id="stage"></div>

<div class="hud-l">
  <div class="floor"><span id="floorNum">1</span><span class="f">F</span><span class="of">/ 20</span></div>
  <div id="hearts"></div>
  <div id="ups"></div>
  <button id="mute" type="button" aria-pressed="false">🔊 音あり</button>
</div>
<div class="hud-r">
  <span class="lbl">部屋タイム</span>
  <div id="roomTime">0.0<small>s</small></div>
  <span class="par">目安 30s</span>
  <span id="seed">SEED -----</span>
</div>
<div id="toast"></div>
<div id="hint">
  <span><kbd>WASD</kbd> 移動</span>
  <span><kbd>Space</kbd> ジャンプ</span>
  <span><kbd>Shift</kbd> ダッシュ</span>
  <span><kbd>R</kbd> やり直し</span>
  <span><kbd>M</kbd> 音のオン・オフ</span>
</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button id="jumpBtn" type="button" aria-label="ジャンプ">JUMP</button>
</div>

<div id="overlay"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
